<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .cap {
      position: absolute;
      left: 0;
      top: 168px;
      width: 1080px;
      height: 216px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .cap-line {
      width: 900px;
      text-align: center;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 64px;
      line-height: 1.2;
      letter-spacing: -0.015em;
      color: #8d8f94;
    }
    .w {
      display: inline-block;
      position: relative;
      color: #ffffff;
    }
    .w.key {
      font-weight: 700;
      color: #ffffff;
    }
    .kw {
      position: relative;
      display: inline-block;
    }
    .w.key .tail {
      font-weight: 400;
      color: #8d8f94;
    }
    .sel {
      position: absolute;
      left: -12px;
      right: -12px;
      top: -2px;
      bottom: -4px;
      border: 2px solid #3d8bff;
      opacity: 0;
    }
    .sel i {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border: 2px solid #3d8bff;
      box-sizing: border-box;
    }
    .sel i:nth-child(1) { left: -7px; top: -7px; }
    .sel i:nth-child(2) { right: -7px; top: -7px; }
    .sel i:nth-child(3) { left: -7px; bottom: -7px; }
    .sel i:nth-child(4) { right: -7px; bottom: -7px; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="cap-1" class="cap clip" data-start="0" data-duration="5" data-track-index="0">
      <div class="cap-line">Deine Karte hat <span class="key">keinen</span> Akku.</div>
    </div>
    <div id="cap-2" class="cap clip" data-start="5" data-duration="5" data-track-index="0">
      <div class="cap-line">Trotzdem <span class="key">funkt</span> sie.</div>
    </div>
    <div id="cap-3" class="cap clip" data-start="10" data-duration="5" data-track-index="0">
      <div class="cap-line">Im Inneren steckt eine <span class="key">Antenne</span>,</div>
    </div>
    <div id="cap-4" class="cap clip" data-start="15" data-duration="5" data-track-index="0">
      <div class="cap-line">verbunden mit einem winzigen <span class="key">Chip</span>.</div>
    </div>
    <div id="cap-5" class="cap clip" data-start="20" data-duration="5" data-track-index="0">
      <div class="cap-line">Das Terminal <span class="key">versorgt</span> die Karte mit Strom.</div>
    </div>
    <div id="cap-6" class="cap clip" data-start="25" data-duration="5" data-track-index="0">
      <div class="cap-line">Das klappt nur auf wenigen <span class="key">Zentimetern</span>.</div>
    </div>
    <div id="cap-7" class="cap clip" data-start="30" data-duration="5" data-track-index="0">
      <div class="cap-line">Und für jede Zahlung schickt sie einen neuen <span class="key">Einmal-Code</span>.</div>
    </div>
  </div>
  <script>
    (function () {
      // Wörter in Spans zerlegen (die Sätze stehen lesbar im HTML oben)
      var lines = document.querySelectorAll("#root .cap-line");
      lines.forEach(function (line) {
        var out = [];
        line.childNodes.forEach(function (n) {
          if (n.nodeType === 3) {
            n.textContent.split(/\s+/).forEach(function (w) {
              if (w) out.push({ text: w, key: false });
            });
          } else {
            out.push({ text: n.textContent, key: true });
          }
        });
        // Satzzeichen hängen am vorherigen Wort
        var merged = [];
        out.forEach(function (w) {
          if (/^[.,!?]$/.test(w.text) && merged.length) merged[merged.length - 1].tail = w.text;
          else merged.push(w);
        });
        line.innerHTML = merged
          .map(function (w) {
            // Satzzeichen erscheint mit seinem Wort; beim Schlüsselwort bleibt es grau und außerhalb des Rahmens
            var tail = w.tail ? '<span class="tail">' + w.tail + "</span>" : "";
            var inner = w.key
              ? '<span class="kw">' + w.text + '<span class="sel"><i></i><i></i><i></i><i></i></span></span>' + tail
              : w.text + tail;
            return '<span class="w' + (w.key ? " key" : "") + '">' + inner + "</span>";
          })
          .join(" ");
      });

      var tl = gsap.timeline({ paused: true });
      var STAGGER = 0.17;
      document.querySelectorAll("#root .cap").forEach(function (cap) {
        var start = parseFloat(cap.getAttribute("data-start"));
        var dur = parseFloat(cap.getAttribute("data-duration"));
        var line = cap.querySelector(".cap-line");
        var words = cap.querySelectorAll(".w");
        var t0 = start + 0.3;
        tl.fromTo(line, { opacity: 1 }, { opacity: 1, duration: 0.01 }, start);
        words.forEach(function (w, i) {
          var at = t0 + i * STAGGER;
          // Wort erscheint einzeln: Unschärfe -> scharf, weiß
          tl.fromTo(
            w,
            { opacity: 0, filter: "blur(8px)", color: "#ffffff" },
            { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
            at,
          );
          if (w.classList.contains("key")) {
            var sel = w.querySelector(".sel");
            tl.fromTo(sel, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, at + 0.08);
            tl.to(sel, { opacity: 0, duration: 0.25, ease: "power2.in" }, at + 1.35);
          } else {
            // bereits gezeigte Wörter bleiben grau stehen
            tl.to(w, { color: "#8d8f94", duration: 0.3, ease: "power1.out" }, at + STAGGER + 0.05);
          }
        });
        if (start + dur < 35) {
          tl.to(line, { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, start + dur - 0.45);
          tl.set(line, { opacity: 0 }, start + dur - 0.2);
        }
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
