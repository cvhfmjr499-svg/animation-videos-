<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #film-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="film" data-width="1080" data-height="1920">
    <canvas id="film-cv" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      const T = THREE;
      const k = KIT.stage(document.getElementById("film-cv"), { fov: 30, envIntensity: 0.85 });
      KIT.post(k, { strength: 0.75, threshold: 1.15, vignette: 0.6, grain: 0.03 });
      const { scene, camera } = k;
      scene.background = new T.Color(0x07070a);
      const rnd = KIT.rng(2026);
      const smooth = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
      const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      /* ---------- Texturen ---------- */
      const cardTex = KIT.canvasTex(1712, 1080, (g, w, h) => {
        const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#151a36"); gr.addColorStop(0.5, "#06070c"); gr.addColorStop(1, "#21123a");
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
        const rg = g.createRadialGradient(w * 0.75, h * 0.2, 0, w * 0.75, h * 0.2, w * 0.7); rg.addColorStop(0, "rgba(120,140,255,0.18)"); rg.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = rg; g.fillRect(0, 0, w, h);
        g.lineWidth = 1.4;
        for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(150,170,255,${0.03 + (i % 5) * 0.008})`; g.beginPath(); for (let x = 0; x <= w; x += 12) { const y = h * 0.15 + i * 13 + Math.sin(x * 0.004 + i * 0.21) * 60 + Math.sin(x * 0.011 + i) * 14; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
        // Kontaktlos-Symbol
        g.strokeStyle = "rgba(235,240,255,0.9)"; g.lineCap = "round"; g.lineWidth = 16;
        for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(1380, 330, 34 + i * 34, -0.62, 0.62); g.stroke(); }
        // Hologramm-Feld
        const hg = g.createLinearGradient(1330, 830, 1560, 980); ["#7df9ff", "#b388ff", "#ff8ad8", "#ffe27a", "#7dffb2"].forEach((c, i) => hg.addColorStop(i / 4, c));
        g.globalAlpha = 0.55; g.fillStyle = hg; g.beginPath(); g.roundRect(1330, 820, 230, 150, 22); g.fill(); g.globalAlpha = 1;
      });
      cardTex.repeat.set(1 / 0.856, 1 / 0.54); cardTex.offset.set(0.5, 0.5);
      const chipTex = KIT.canvasTex(330, 255, (g, w, h) => {
        const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#f3d78a"); gr.addColorStop(0.5, "#c99a3c"); gr.addColorStop(1, "#f0cf7a");
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(60,40,10,0.75)"; g.lineWidth = 5;
        g.strokeRect(w * 0.36, h * 0.3, w * 0.28, h * 0.4);
        for (const y of [0.3, 0.5, 0.7]) { g.beginPath(); g.moveTo(0, h * y); g.lineTo(w * 0.36, h * y); g.moveTo(w * 0.64, h * y); g.lineTo(w, h * y); g.stroke(); }
        g.beginPath(); g.moveTo(w * 0.5, 0); g.lineTo(w * 0.5, h * 0.3); g.moveTo(w * 0.5, h * 0.7); g.lineTo(w * 0.5, h); g.stroke();
      });
      chipTex.repeat.set(1 / 0.11, 1 / 0.085); chipTex.offset.set(0.5, 0.5);
      const dieTex = KIT.canvasTex(512, 400, (g, w, h) => {
        g.fillStyle = "#020403"; g.fillRect(0, 0, w, h);
        const r = KIT.rng(9);
        g.lineWidth = 2;
        for (let i = 0; i < 260; i++) { g.strokeStyle = r() > 0.75 ? "#ffd27a" : "#5dffc0"; g.globalAlpha = 0.5 + r() * 0.5; let x = Math.floor(r() * 32) * 16, y = Math.floor(r() * 25) * 16; g.beginPath(); g.moveTo(x, y); for (let s = 0; s < 4; s++) { if (r() > 0.5) x += (r() > 0.5 ? 1 : -1) * Math.floor(r() * 6) * 16; else y += (r() > 0.5 ? 1 : -1) * Math.floor(r() * 6) * 16; g.lineTo(x, y); } g.stroke(); g.fillStyle = g.strokeStyle; g.fillRect(x - 3, y - 3, 6, 6); }
        g.globalAlpha = 1;
      });
      const dashTex = KIT.canvasTex(512, 4, (g, w, h) => { g.fillStyle = "#000"; g.fillRect(0, 0, w, h); const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.8, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, w * 0.35, h); });
      dashTex.wrapS = T.RepeatWrapping; dashTex.colorSpace = T.NoColorSpace;
      const screenIdle = KIT.canvasTex(600, 500, (g, w, h) => {
        g.fillStyle = "#02060a"; g.fillRect(0, 0, w, h);
        const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, 230); rg.addColorStop(0, "rgba(40,220,200,0.35)"); rg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0, 0, w, h);
        g.strokeStyle = "#8ffff0"; g.lineCap = "round"; g.lineWidth = 16;
        for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(w / 2 - 70, h / 2, 30 + i * 32, -0.62, 0.62); g.stroke(); }
      });
      const screenOk = KIT.canvasTex(600, 500, (g, w, h) => {
        g.fillStyle = "#02080a"; g.fillRect(0, 0, w, h);
        const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, 250); rg.addColorStop(0, "rgba(40,255,120,0.45)"); rg.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = rg; g.fillRect(0, 0, w, h);
        g.fillStyle = "#33e07a"; g.beginPath(); g.arc(w / 2, h / 2, 120, 0, 6.283); g.fill();
        g.strokeStyle = "#02160a"; g.lineWidth = 26; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(w / 2 - 55, h / 2 + 2); g.lineTo(w / 2 - 12, h / 2 + 45); g.lineTo(w / 2 + 62, h / 2 - 45); g.stroke();
      });

      /* ---------- Boden + Licht ---------- */
      KIT.floor(scene, 0, 0x0b0b0f);
      scene.add(new T.HemisphereLight(0x8aa0ff, 0x050507, 0.12));
      const key = KIT.keyLight(scene, new T.Vector3(2.2, 4.4, 3.8), new T.Vector3(0, 0.5, 0.4), 55, 0xfff2e6); key.angle = 0.42; key.penumbra = 1;
      const rimL = new T.SpotLight(0x6fb8ff, 18, 0, 0.5, 0.9, 2); rimL.position.set(-2.6, 2.2, -1.8); rimL.target.position.set(0, 0.6, 0.4); scene.add(rimL); scene.add(rimL.target);
      const sweep = new T.SpotLight(0xffffff, 0, 0, 0.12, 0.9, 2); scene.add(sweep); scene.add(sweep.target);
      const tealL = new T.PointLight(0x2fffe0, 0, 2.5, 2); scene.add(tealL);
      const greenL = new T.PointLight(0x3dff88, 0, 3, 2); scene.add(greenL);

      /* ---------- Terminal ---------- */
      const term = new T.Group(); scene.add(term);
      const tBody = new T.Mesh(KIT.roundBox(0.8, 1.55, 0.2, 0.14, 0.025), new T.MeshPhysicalMaterial({ color: 0x17181d, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 0.9 }));
      tBody.castShadow = true; tBody.receiveShadow = true; term.add(tBody);
      const bezel = new T.Mesh(KIT.roundBox(0.68, 0.58, 0.01, 0.05, 0.004), new T.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.1, clearcoat: 1 })); bezel.position.set(0, 0.36, 0.1); term.add(bezel);
      const scrMat = new T.MeshBasicMaterial({ map: screenIdle, toneMapped: false }); scrMat.color.setScalar(0);
      const scr = new T.Mesh(new T.PlaneGeometry(0.6, 0.5), scrMat); scr.position.set(0, 0.36, 0.1055); term.add(scr);
      const scrGlass = new T.Mesh(new T.PlaneGeometry(0.66, 0.56), new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, transparent: true, opacity: 0.08, clearcoat: 1, envMapIntensity: 2.2, depthWrite: false })); scrGlass.position.set(0, 0.36, 0.107); term.add(scrGlass);
      const leds = [];
      for (let i = 0; i < 4; i++) { const m = new T.Mesh(KIT.roundBox(0.075, 0.022, 0.01, 0.01, 0.003), new T.MeshBasicMaterial({ color: 0x1a1d22 })); m.position.set(-0.135 + i * 0.09, 0.69, 0.1); term.add(m); leds.push(m); }
      const keyG = KIT.roundBox(0.17, 0.085, 0.024, 0.02, 0.006);
      const keyCols = [0x2b2d34, 0x2b2d34, 0x2b2d34];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { const m = new T.Mesh(keyG, KIT.mat.plastic(0x2b2d34, 0.5)); m.position.set(-0.22 + c * 0.22, -0.06 - r * 0.115, 0.1); m.castShadow = true; term.add(m); }
      [0x7a1f22, 0x8a7420, 0x1f6a34].forEach((c, i) => { const m = new T.Mesh(keyG, KIT.mat.plastic(c, 0.45)); m.position.set(-0.22 + i * 0.22, -0.54, 0.1); term.add(m); });
      const TILT = 0.36;
      term.rotation.x = -Math.PI / 2 + TILT;
      term.updateMatrixWorld(true);
      const bb = new T.Box3().setFromObject(term); term.position.y = -bb.min.y + 0.002; term.position.z = -0.1; term.updateMatrixWorld(true);
      const S = new T.Vector3(0, 0.36, 0.11).applyMatrix4(term.matrixWorld);
      const N = new T.Vector3(0, 0, 1).transformDirection(term.matrixWorld).normalize();
      const qN = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 0, 1), N);

      /* ---------- Karte ---------- */
      const card = new T.Group(); scene.add(card);
      const faceMat = new T.MeshPhysicalMaterial({ map: cardTex, roughness: 0.36, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.22, envMapIntensity: 1.3, transparent: true });
      const edgeMat = new T.MeshStandardMaterial({ color: 0x24252d, roughness: 0.35, metalness: 0.6, transparent: true });
      const cardMesh = new T.Mesh(KIT.roundBox(0.856, 0.54, 0.0076, 0.032, 0.0016), [faceMat, edgeMat]); cardMesh.castShadow = true; card.add(cardMesh);
      const CHIP = new T.Vector3(-0.27, 0.04, 0);
      const chipMat = new T.MeshStandardMaterial({ map: chipTex, metalness: 1, roughness: 0.28, envMapIntensity: 1.4, transparent: true });
      const chip = new T.Mesh(KIT.roundBox(0.11, 0.085, 0.003, 0.012, 0.0008), [chipMat, chipMat]); chip.position.set(CHIP.x, CHIP.y, 0.0042); card.add(chip);
      const dieMat = new T.MeshStandardMaterial({ map: dieTex, emissiveMap: dieTex, emissive: 0xffffff, emissiveIntensity: 0, roughness: 0.4, metalness: 0.3 });
      const die = new T.Mesh(new T.PlaneGeometry(0.05, 0.04), dieMat); die.position.set(CHIP.x, CHIP.y, 0.0005); card.add(die);
      // Antennenspule
      const pts = [];
      const TURNS = 4, PER = 90;
      for (let i = 0; i <= TURNS * PER; i++) {
        const turn = i / PER, a = (i % PER) / PER;
        const inset = 0.03 + turn * 0.012, hx = 0.428 - inset, hy = 0.27 - inset, rr = 0.03;
        // Umfang eines abgerundeten Rechtecks, Parameter a in [0,1)
        const L = 2 * (2 * (hx - rr) + 2 * (hy - rr)) + 2 * Math.PI * rr; let d = a * L;
        const segs = [[hx - rr, 0], [0, 1], [hy - rr, 0], [1, 1]];
        let x, y;
        const sx = hx - rr, sy = hy - rr, arc = Math.PI * rr / 2;
        const path = [[2 * sx, (u) => [-sx + u, -hy]], [arc, (u) => { const th = -Math.PI / 2 + u / rr; return [sx + Math.cos(th) * rr, -sy + Math.sin(th) * rr]; }], [2 * sy, (u) => [hx, -sy + u]], [arc, (u) => { const th = u / rr; return [sx + Math.cos(th) * rr, sy + Math.sin(th) * rr]; }], [2 * sx, (u) => [sx - u, hy]], [arc, (u) => { const th = Math.PI / 2 + u / rr; return [-sx + Math.cos(th) * rr, sy + Math.sin(th) * rr]; }], [2 * sy, (u) => [-hx, sy - u]], [arc, (u) => { const th = Math.PI + u / rr; return [-sx + Math.cos(th) * rr, -sy + Math.sin(th) * rr]; }]];
        for (const [len, f] of path) { if (d <= len) { [x, y] = f(d); break; } d -= len; }
        if (x === undefined) [x, y] = path[0][1](0);
        pts.push(new T.Vector3(x, y, 0));
      }
      const last = pts[pts.length - 1];
      pts.push(new T.Vector3(last.x + 0.04, last.y + 0.05, 0), new T.Vector3(CHIP.x - 0.035, CHIP.y - 0.02, 0), new T.Vector3(CHIP.x - 0.02, CHIP.y, 0));
      const coilCurve = new T.CatmullRomCurve3(pts, false, "catmullrom", 0.1);
      const coilMat = new T.MeshStandardMaterial({ color: 0xb87333, metalness: 1, roughness: 0.3, emissive: 0xff8a2a, emissiveMap: dashTex, emissiveIntensity: 0, transparent: true, opacity: 0 });
      dashTex.repeat.set(36, 1);
      const coil = new T.Mesh(new T.TubeGeometry(coilCurve, 1600, 0.0024, 6, false), coilMat); card.add(coil);
      const edgeLines = new T.LineSegments(new T.EdgesGeometry(cardMesh.geometry, 30), new T.LineBasicMaterial({ color: 0x8ffff0, transparent: true, opacity: 0 })); card.add(edgeLines);
      edgeLines.material.color.multiplyScalar(2.2);

      /* ---------- Magnetfeld ---------- */
      const teal = new T.Color(0x2fffe0).multiplyScalar(2.6);
      const rings = [];
      for (let i = 0; i < 6; i++) { const m = new T.Mesh(new T.TorusGeometry(0.3, 0.0045, 8, 128), new T.MeshBasicMaterial({ color: teal, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false })); scene.add(m); rings.push(m); }
      const fieldTex = dashTex.clone(); fieldTex.needsUpdate = true; fieldTex.repeat.set(6, 1);
      const fieldMat = new T.MeshBasicMaterial({ color: teal, alphaMap: fieldTex, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false });
      const axis = N.clone(), base0 = S.clone().addScaledVector(N, -0.04);
      const ref = Math.abs(axis.y) < 0.9 ? new T.Vector3(0, 1, 0) : new T.Vector3(1, 0, 0);
      const u1 = new T.Vector3().crossVectors(axis, ref).normalize(), u2 = new T.Vector3().crossVectors(axis, u1).normalize();
      for (const Lk of [0.55, 0.85, 1.2]) for (let j = 0; j < 5; j++) {
        const phi = j / 5 * Math.PI * 2 + Lk * 2.1, rad = u1.clone().multiplyScalar(Math.cos(phi)).addScaledVector(u2, Math.sin(phi));
        const fp = []; for (let s = 0; s <= 80; s++) { const th = 0.12 + (Math.PI - 0.24) * s / 80, r = Lk * Math.sin(th) * Math.sin(th); fp.push(base0.clone().addScaledVector(axis, Math.cos(th) * r).addScaledVector(rad, Math.sin(th) * r)); }
        const tube = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(fp), 160, 0.0028, 5, false), fieldMat); scene.add(tube);
      }
      /* ---------- Datenpakete ---------- */
      const NP = 18;
      const pUp = new T.InstancedMesh(new T.SphereGeometry(0.011, 12, 10), new T.MeshBasicMaterial({ color: new T.Color(0xffb04a).multiplyScalar(4) }), NP);
      const pDn = new T.InstancedMesh(new T.SphereGeometry(0.011, 12, 10), new T.MeshBasicMaterial({ color: new T.Color(0x3dfff0).multiplyScalar(4) }), NP);
      scene.add(pUp); scene.add(pDn);
      const burst = new T.Mesh(new T.TorusGeometry(0.3, 0.012, 12, 128), new T.MeshBasicMaterial({ color: new T.Color(0x3dff88).multiplyScalar(3), transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false }));
      burst.quaternion.copy(qN); burst.position.copy(S).addScaledVector(N, 0.01); scene.add(burst);
      const burst2 = burst.clone(); burst2.material = burst.material.clone(); scene.add(burst2);

      /* ---------- Zustände ---------- */
      const st = { spin: -0.6, dock: 0, xray: 0, field: 0, current: 0, chip: 0, screen: 0, ok: 0, burst: 0, led: 0, sweepP: -1, fade: 0, lift: 0, endSpin: 0 };
      const heroPos = new T.Vector3(0, 1.02, 0.95), endPos = new T.Vector3(0, 1.08, 0.75);
      const hoverPos = S.clone().addScaledVector(N, 0.075);
      const qHover = qN.clone().multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), 0.0));
      const cardKey = new T.SpotLight(0xe8eeff, 45, 0, 0.35, 1, 2); scene.add(cardKey); scene.add(cardKey.target);
      const qHero = new T.Quaternion(), e = new T.Euler(), mtx = new T.Matrix4(), v = new T.Vector3(), v2 = new T.Vector3(), tmpQ = new T.Quaternion();
      const chipWorld = new T.Vector3();

      /* ---------- Kamera-Einstellungen ---------- */
      const shots = {
        A: (t) => [new T.Vector3(0.5 + t * 0.015, 1.25, 4.9 - t * 0.08), new T.Vector3(0, 0.95, 0.95)],
        B: (t) => [new T.Vector3(2.1, 2.0, 5.2), new T.Vector3(0, 0.6, 0.35)],
        C: (t) => [new T.Vector3(2.5, 0.95, 2.1), hoverPos.clone()],
        D: (t) => [hoverPos.clone().addScaledVector(N, 2.9).add(v.set(0.45, 0, 0.3)), hoverPos.clone()],
        E: (t) => { const o = Math.sin(t * 0.35) * 0.05; return [chipWorld.clone().addScaledVector(N, 0.32).add(v.set(0.14 + o, 0.03, 0.1)), chipWorld.clone()]; },
        F: (t) => [new T.Vector3(-1.9, 1.9, 4.6), new T.Vector3(0, 0.45, 0.25)],
        G: (t) => [new T.Vector3(0.45, 1.3, 4.7), endPos.clone().add(new T.Vector3(0, -0.1, 0))],
      };
      const camKeys = [["A", 0, 0], ["B", 4.6, 2.0], ["C", 8.6, 3.2], ["D", 12.4, 2.4], ["E", 17.0, 1.8], ["F", 23.6, 2.0], ["G", 28.6, 2.6]];
      const camAt = (t) => {
        let i = 0; while (i + 1 < camKeys.length && t >= camKeys[i + 1][1] - camKeys[i + 1][2]) i++;
        const [nm, at] = camKeys[i]; const [p, q] = shots[nm](t);
        if (i + 1 < camKeys.length) { const [nn, at2, dur] = camKeys[i + 1]; const s = ease((t - (at2 - dur)) / dur); if (s > 0) { const [p2, q2] = shots[nn](t); p.lerp(p2, s); q.lerp(q2, s); } }
        return [p, q];
      };

      const clk = { t: 0 };
      const update = () => {
        const t = clk.t;
        // Karte
        e.set(0.12 + Math.sin(t * 0.7) * 0.05, st.spin + st.endSpin, 0.04 * Math.sin(t * 0.5)); qHero.setFromEuler(e);
        const bob = Math.sin(t * 1.3) * 0.012;
        const dk = ease(st.dock);
        const from = st.lift > 0 ? endPos : heroPos;
        card.position.lerpVectors(v.copy(from).add(v2.set(0, bob, 0)), hoverPos, dk);
        card.quaternion.slerpQuaternions(qHero, qHover, dk);
        card.updateMatrixWorld(true);
        chipWorld.copy(CHIP).applyMatrix4(card.matrixWorld);
        cardKey.position.copy(card.position).add(v.set(0.6, 0.9, 1.6)); cardKey.target.position.copy(card.position); cardKey.target.updateMatrixWorld(); cardKey.intensity = 45 * (1 - dk * 0.8); key.intensity = 55 * (1 - 0.55 * dk);
        // Röntgen
        const x = st.xray;
        faceMat.opacity = 1 - 0.86 * x; edgeMat.opacity = 1 - 0.8 * x; chipMat.opacity = 1 - 0.75 * x;
        faceMat.depthWrite = x < 0.05; chipMat.depthWrite = x < 0.05;
        coilMat.opacity = x; edgeLines.material.opacity = 0.9 * x;
        coilMat.emissiveIntensity = 6 * st.current; dashTex.offset.x = -t * 1.6;
        dieMat.emissiveIntensity = 3.2 * st.chip;
        // Feld
        for (let i = 0; i < rings.length; i++) { const p = (t * 0.42 + i / rings.length) % 1; rings[i].position.copy(S).addScaledVector(N, 0.02 + p * 0.85); rings[i].quaternion.copy(qN); rings[i].scale.setScalar(0.55 + p * 0.9); rings[i].material.opacity = st.field * Math.sin(Math.PI * p) * 0.75 * (1 - 0.7 * x); }
        fieldMat.opacity = st.field * 0.55 * (1 - 0.4 * x); fieldTex.offset.x = -t * 0.5;
        tealL.position.copy(S).addScaledVector(N, 0.02); tealL.intensity = st.field * 0.7;
        // Bildschirm + LEDs
        scrMat.map = st.ok > 0.5 ? screenOk : screenIdle; scrMat.color.setScalar(1.35 * st.screen * (1 - 0.6 * x * (1 - st.ok)));
        leds.forEach((m, i) => { const on = st.led > i + 0.5; m.material.color.set(st.ok > 0.5 ? 0x3dff88 : (on ? 0x3dff88 : 0x1a1d22)); if (on || st.ok > 0.5) m.material.color.multiplyScalar(3.2); });
        greenL.position.copy(S).addScaledVector(N, 0.2); greenL.intensity = st.burst > 0 ? 3.5 * Math.sin(Math.PI * Math.min(1, st.burst)) + 0.6 * st.ok : 0;
        [burst, burst2].forEach((b, i) => { const p = Math.max(0, Math.min(1, st.burst * 1.25 - i * 0.25)); b.scale.setScalar(0.4 + p * 2.6); b.material.opacity = p > 0 && p < 1 ? (1 - p) * (1 - p) : 0; });
        // Datenpakete (Karte -> Terminal und zurück)
        const ctrl = v2.copy(chipWorld).lerp(S, 0.5).addScaledVector(N, 0.12);
        for (let i = 0; i < NP; i++) {
          const t0 = 17.6 + i * 0.2, u = (t - t0) / 0.55;
          const on = u > 0 && u < 1;
          const a = on ? ease(u) : 0, s = on ? Math.sin(Math.PI * u) * 1.2 + 0.2 : 0;
          const up = new T.Vector3().copy(chipWorld).multiplyScalar((1 - a) * (1 - a)).addScaledVector(ctrl, 2 * a * (1 - a)).addScaledVector(S, a * a);
          mtx.makeScale(s, s, s).setPosition(up); pUp.setMatrixAt(i, mtx);

          const t1 = t0 + 0.1, u2 = (t - t1) / 0.55, on2 = u2 > 0 && u2 < 1, a2 = on2 ? ease(u2) : 0, s2 = on2 ? Math.sin(Math.PI * u2) * 1.2 + 0.2 : 0;
          dn.copy(S).multiplyScalar((1 - a2) * (1 - a2)).addScaledVector(ctrl, 2 * a2 * (1 - a2)).addScaledVector(chipWorld, a2 * a2);

        // Lichtstreif über die Karte
        sweep.intensity = st.sweepP > -1 && st.sweepP < 1 ? 220 * Math.sin(Math.PI * (st.sweepP + 1) / 2) : 0;
        sweep.position.copy(card.position).add(v.set(-1.6 + (st.sweepP + 1) * 1.6, 1.4, 1.4)); sweep.target.position.copy(card.position); sweep.target.updateMatrixWorld();
        // Kamera
        const [cp, ct] = camAt(t); camera.position.copy(cp); camera.lookAt(ct);
        k.post.seed.value = (Math.floor(t * 30) % 97) * 1.37; k.post.fade.value = 1 - st.fade;
        k.render();
      };

      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => { clk.t = tl.time(); update(); }); tl.set({}, {}, 34);
      // Hook: Karte im Dunkeln, Lichtstreif
      tl.fromTo(st, { spin: -0.75 }, { spin: 0.35, duration: 5.2, ease: "power1.inOut" }, 0);
      tl.fromTo(st, { sweepP: -1 }, { sweepP: 1, duration: 2.2, ease: "power2.inOut" }, 0.3);
      // Terminal erwacht
      tl.fromTo(st, { screen: 0 }, { screen: 1, duration: 0.6, ease: "power2.out" }, 3.4);
      // Karte gleitet zum Terminal
      tl.fromTo(st, { dock: 0 }, { dock: 1, duration: 3.2, ease: "none" }, 5.2);
      tl.fromTo(st, { field: 0 }, { field: 1, duration: 1.2, ease: "power2.out" }, 6.4);
      tl.fromTo(st, { led: 0 }, { led: 1, duration: 0.01 }, 9.4);
      // Röntgenblick

      tl.fromTo(st, { current: 0 }, { current: 1, duration: 1.0, ease: "power2.out" }, 13.2);
      tl.to(st, { led: 2, duration: 0.01 }, 14.0);
      tl.fromTo(st, { chip: 0 }, { chip: 1, duration: 1.5, ease: "power2.inOut" }, 16.0);
      tl.to(st, { led: 3, duration: 0.01 }, 19.0);
      tl.to(st, { led: 4, duration: 0.01 }, 20.6);

      tl.fromTo(st, { burst: 0 }, { burst: 1, duration: 1.4, ease: "power2.out" }, 22.6);

      tl.set(st, { lift: 1 }, 26.0);
