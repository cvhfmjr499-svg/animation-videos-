<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s3-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s3-vig { position: absolute; inset: 0; }
    .pin { position: absolute; left: 0; top: 0; pointer-events: none; }
    .pin i { position: absolute; left: 0; top: 0; width: 2px; background: #e8e7ea; }
    .pin b { position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; }
    .pin span { position: absolute; white-space: nowrap; font: 600 28px "Inter", sans-serif; letter-spacing: 0.14em; color: #ecebef; text-transform: uppercase; }
    #s3-count { position: absolute; left: 70px; top: 470px; }
    #s3-num { font: 800 120px "Inter", sans-serif; color: #fff; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    #s3-num small { font-size: 52px; font-weight: 700; margin-left: 10px; }
    #s3-sub { font: 500 28px "Inter", sans-serif; color: #b9b8be; margin-top: 10px; }
    #s3-foot { position: absolute; left: 70px; top: 1290px; font: 400 28px "Inter", sans-serif; color: #8a898f; }
  </style>
  <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
    <canvas id="s3-cv" width="1080" height="1920"></canvas>
    <div id="s3-vig"></div>
    <div class="pin" id="s3-pin-in" style="opacity: 0;"><span style="left: -60px; top: -20px;">Innen</span></div>
    <div class="pin" id="s3-pin-out" style="opacity: 0;"><span style="left: -60px; top: -20px;">Außen</span></div>
    <div class="pin" id="s3-pin-pane" style="opacity: 0;"><b></b><i style="height: 90px;"></i><span style="left: 14px; top: 70px;">Fenster</span></div>
    <div class="pin" id="s3-pin-piano" style="opacity: 0;"><b></b><i style="height: 80px; top: -80px;"></i><span style="left: -60px; top: -122px;">Konzertflügel ≈ 480 kg</span></div>
    <div id="s3-count" style="opacity: 0;">
      <div id="s3-num"><span id="s3-val">0</span><small>kg</small></div>
      <div id="s3-sub">Kraft auf ein Fenster</div>
    </div>
    <div id="s3-foot" style="opacity: 0;">Fenster ca. 26 × 37 cm · Druckunterschied 0,52 bar</div>
  </div>
  <script>
    (function () {
      const T = THREE;
      document.getElementById("s3-vig").style.background = KIT.VIG;
      const k = KIT.stage(document.getElementById("s3-cv"), { fov: 30, exposure: 1.0, envIntensity: 0.7 });
      const { scene, camera } = k;
      const rnd = KIT.rng(4242);
      const FY = -0.95;
      KIT.floor(scene, FY, 0x121116);
      // Wandstück (in der YZ-Ebene), innen = -x, außen = +x
      const wall = new T.Mesh(KIT.frame(1.3, 1.9, 0.08, 0.3, 0.42, 0.13, 0.12, 0.01), [KIT.mat.plastic(0xe7e3db, 0.5), KIT.mat.plastic(0x9c968c, 0.6)]);
      wall.rotation.y = Math.PI / 2; wall.position.y = FY + 0.95 + 0.0; wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
      // Scheibe, wölbt sich nach außen
      const pg = new T.PlaneGeometry(0.34, 0.46, 24, 24); pg.rotateY(Math.PI / 2);
      const base = pg.attributes.position.array.slice();
      const pane = new T.Mesh(pg, KIT.mat.glass(0xbfe0ff, 0.45)); scene.add(pane);
      const bulge = (b) => {
        const a = pg.attributes.position.array;
        for (let i = 0; i < a.length; i += 3) { const y = base[i + 1] / 0.23, z = base[i + 2] / 0.17; a[i] = base[i] + b * Math.max(0, (1 - y * y)) * Math.max(0, (1 - z * z)); }
        pg.attributes.position.needsUpdate = true; pg.computeVertexNormals();
      };
      // Druckpfeile
      const arrowMat = new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.3 });
      const arrows = [];
      for (const [y, z] of [[0.12, -0.08], [0.12, 0.08], [-0.02, 0], [-0.14, -0.08], [-0.14, 0.08]]) {
        const g = new T.Group();
        const sh = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 0.32, 16), arrowMat); sh.rotation.z = Math.PI / 2; sh.position.x = -0.16; g.add(sh);
        const hd = new T.Mesh(new T.ConeGeometry(0.035, 0.08, 24), arrowMat); hd.rotation.z = -Math.PI / 2; hd.position.x = 0.02; g.add(hd);
        g.position.set(-0.1, y, z); scene.add(g); arrows.push(g);
      }
      // Luftteilchen
      const dotG = new T.SphereGeometry(0.009, 10, 8);
      const mk = (n, place, c) => { const m = new T.InstancedMesh(dotG, new T.MeshBasicMaterial({ color: c, toneMapped: false }), n); const d = []; for (let i = 0; i < n; i++) d.push({ p: place(), ph: rnd() * 6.28, w: 0.8 + rnd() * 1.4 }); scene.add(m); return { m, d }; };
      const din = mk(380, () => new T.Vector3(-0.15 - rnd() * 1.4, -0.85 + rnd() * 1.75, -0.7 + rnd() * 1.4), 0x9fd2ff);
      const dout = mk(40, () => new T.Vector3(0.15 + rnd() * 1.4, -0.85 + rnd() * 1.75, -0.7 + rnd() * 1.4), 0x6fa8de);
      // Konzertflügel (schwarz, Hochglanz)
      const piano = new T.Group();
      const ps = new T.Shape(); ps.moveTo(0, 0); ps.lineTo(0.55, 0); ps.lineTo(0.55, 0.45); ps.bezierCurveTo(0.55, 0.8, 0.35, 0.95, 0.15, 1.15); ps.bezierCurveTo(0.05, 1.3, 0.0, 1.4, -0.05, 1.45); ps.bezierCurveTo(-0.2, 1.5, -0.32, 1.45, -0.35, 1.25); ps.lineTo(-0.35, 0); ps.lineTo(0, 0);
      const black = new T.MeshPhysicalMaterial({ color: 0x1b1b20, roughness: 0.2, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.4 });
      const body = new T.Mesh(new T.ExtrudeGeometry(ps, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 3, curveSegments: 32 }), black);
      body.rotation.x = -Math.PI / 2; body.position.y = 0.55; body.castShadow = true; piano.add(body);
      const lid = new T.Mesh(new T.ExtrudeGeometry(ps, { depth: 0.012, bevelEnabled: false, curveSegments: 32 }), black);
      lid.rotation.x = -Math.PI / 2; lid.rotation.y = -0.6; lid.position.set(0.55, 0.87, 0); lid.geometry.translate(-0.55, 0, 0); lid.castShadow = true; piano.add(lid);
      const keys = new T.Mesh(new T.BoxGeometry(0.9, 0.04, 0.16), KIT.mat.plastic(0xf4f2ee, 0.3)); keys.position.set(0.1, 0.72, 0.08); piano.add(keys);
      for (const [x, z] of [[-0.25, -0.05], [0.45, -0.05], [0.0, -1.3]]) { const l = new T.Mesh(new T.CylinderGeometry(0.035, 0.028, 0.55, 16), black); l.position.set(x, 0.275, z); l.castShadow = true; piano.add(l); }
      piano.scale.setScalar(0.5); piano.rotation.y = 0.35;
      piano.position.set(-1.0, FY, 1.35); piano.visible = false; scene.add(piano);
      // Licht
      scene.add(new T.HemisphereLight(0xa8c0ff, 0x101014, 0.2));
      KIT.keyLight(scene, new T.Vector3(-2.5, 3.0, 2.5), new T.Vector3(-0.3, -0.4, 0), 110).angle = 0.5;
      const rim = new T.SpotLight(0x9cc8ff, 40, 0, 0.5, 0.8, 2); rim.position.set(2.5, 1.5, -1.5); rim.target.position.set(0, 0, 0); scene.add(rim); scene.add(rim.target);
      const pl = new T.SpotLight(0xfff1e0, 60, 0, 0.45, 0.8, 2); pl.position.set(-2.5, 2.5, 3.5); pl.castShadow = true; scene.add(pl); scene.add(pl.target);
      // Pins
      k.pin(document.getElementById("s3-pin-in"), new T.Vector3(-0.6, -0.8, 1.0));
      k.pin(document.getElementById("s3-pin-out"), new T.Vector3(0.7, 0.75, -0.6));
      k.pin(document.getElementById("s3-pin-pane"), new T.Vector3(0.05, -0.22, 0.0));
      const pinV = new T.Vector3(); k.pin(document.getElementById("s3-pin-piano"), pinV);
      const st = { b: 0, ar: 0, pianoY: 1.2, az: -0.95 };
      const mtx = new T.Matrix4(); const clk = { t: 0 };
      const ray = new T.Raycaster(), plane = new T.Plane(new T.Vector3(0, 1, 0), -FY), hit = new T.Vector3();
      const update = () => {
        const t = clk.t;
        din.d.forEach((q, i) => { mtx.makeTranslation(q.p.x + Math.sin(t * q.w * 2 + q.ph) * 0.03, q.p.y + Math.cos(t * q.w * 1.7 + q.ph) * 0.03, q.p.z + Math.sin(t * q.w + q.ph) * 0.03); din.m.setMatrixAt(i, mtx); });
        dout.d.forEach((q, i) => { mtx.makeTranslation(q.p.x + Math.sin(t * q.w + q.ph) * 0.06, q.p.y + Math.cos(t * q.w + q.ph) * 0.06, q.p.z); dout.m.setMatrixAt(i, mtx); });
        din.m.instanceMatrix.needsUpdate = true; dout.m.instanceMatrix.needsUpdate = true;
        bulge(st.b);
        arrows.forEach((g, i) => { g.visible = st.ar > 0.01; g.position.x = -0.12 - (1 - st.ar) * 0.4 + Math.sin(t * 9 + i) * 0.008 * st.ar; g.scale.setScalar(Math.max(0.001, st.ar)); });
        const az = st.az + t * 0.03, r = 7.6;
        camera.position.set(Math.sin(az) * r, 0.9, Math.cos(az) * r);
        camera.lookAt(-0.55, -0.5, 0.45);
        camera.updateMatrixWorld();
        // Flügel auf festen Bildpunkt (links unten) auf den Boden stellen
        ray.setFromCamera(new T.Vector2(-0.3, -0.3), camera); ray.ray.intersectPlane(plane, hit);
        piano.position.set(hit.x, FY + st.pianoY, hit.z); piano.visible = st.pianoY < 1.15; pl.target.position.set(hit.x, FY, hit.z); pl.position.set(hit.x - 1, 2.5, hit.z + 2.5); pl.target.updateMatrixWorld();
        pinV.set(hit.x, FY + 0.62, hit.z);
        k.render();
      };
      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => { clk.t = tl.time(); update(); }); tl.set({}, {}, 6.5);
      tl.fromTo(st, { az: -0.75 }, { az: -0.95, duration: 1.0, ease: "expo.out" }, 0);
      tl.fromTo("#s3-cv", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(["#s3-pin-in", "#s3-pin-out"], { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.08 }, 0.3);
      tl.fromTo("#s3-pin-pane", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.55);
      tl.fromTo("#s3-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
      tl.fromTo(st, { ar: 0 }, { ar: 1, duration: 0.5, ease: "expo.out" }, 1.15);
      tl.fromTo(st, { b: 0 }, { b: 0.05, duration: 2.6, ease: "power2.out" }, 1.2);
      tl.fromTo("#s3-count", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 2.5);
      const kg = { v: 0 };
      tl.fromTo(kg, { v: 0 }, { v: 510, duration: 1.4, ease: "expo.out", onUpdate: () => { document.getElementById("s3-val").textContent = Math.round(kg.v); } }, 2.5);
      // Flügel fällt herein
      tl.to(["#s3-pin-in", "#s3-pin-out"], { opacity: 0, duration: 0.2 }, 4.4);
      tl.fromTo(st, { pianoY: 1.2 }, { pianoY: 0, duration: 0.55, ease: "bounce.out" }, 4.55);
      tl.fromTo("#s3-pin-piano", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 4.95);
      tl.to(["#s3-cv", "#s3-count", "#s3-foot", "#s3-pin-pane", "#s3-pin-piano"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 6.28);
      update();
      window.__timelines["s3"] = tl;
    })();
  </script>
  <script>
    /* WARP START */
    (function () {
      const tl = window.__timelines["s3"].__src || window.__timelines["s3"];
      const w = [[0.0, 0.0], [1.1, 0.918], [2.5, 2.065], [4.4, 3.682], [6.5, 5.766], [6.5, 5.766]];
      const o = gsap.timeline({ paused: true }); o.__src = tl;
      for (let i = 0; i < w.length - 1; i++) o.fromTo(tl, { time: w[i][0] }, { time: w[i + 1][0], duration: Math.max(0.001, w[i + 1][1] - w[i][1]), ease: "none", immediateRender: false }, w[i][1]);
      window.__timelines["s3"] = o;
    })();
    /* WARP END */
  </script>
</template>
