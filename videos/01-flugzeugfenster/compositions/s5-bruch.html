<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s5-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s5-vig { position: absolute; inset: 0; }
    #s5-fog { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 50%, rgba(225, 236, 246, 0.85), rgba(200, 215, 230, 0.35) 60%, rgba(200, 215, 230, 0.1)); }
    #s5-temp { position: absolute; left: 70px; top: 470px; }
    #s5-num { font: 800 96px "Inter", sans-serif; color: #fff; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
    #s5-sub { font: 500 28px "Inter", sans-serif; color: #b9b8be; margin-top: 10px; }
    #s5-foot { position: absolute; left: 70px; top: 1290px; font: 400 28px "Inter", sans-serif; color: #8a898f; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
    <canvas id="s5-cv" width="1080" height="1920"></canvas>
    <div id="s5-vig"></div>
    <div id="s5-fog" style="opacity: 0;"></div>
    <div id="s5-temp" style="opacity: 0;">
      <div id="s5-num"><span id="s5-val">22</span> °C</div>
      <div id="s5-sub">Kabinentemperatur</div>
    </div>
    <div id="s5-foot" style="opacity: 0;">Verlangsamt</div>
  </div>
  <script>
    (function () {
      const T = THREE;
      document.getElementById("s5-vig").style.background = KIT.VIG;
      const k = KIT.stage(document.getElementById("s5-cv"), { fov: 28, exposure: 0.95, envIntensity: 0.5 });
      const { scene, camera } = k;
      const cab = KIT.cabin(k);
      const rnd = KIT.rng(777);
      const crackPaths = [
        [330, 330, 368, 280, 392, 292, 430, 228, 452, 160, 470, 60], [330, 330, 300, 362, 268, 380, 246, 430, 200, 520, 150, 640],
        [330, 330, 360, 380, 340, 450, 372, 560, 350, 700], [330, 330, 270, 300, 220, 312, 160, 250, 90, 200], [330, 330, 400, 350, 460, 410, 500, 420],
        [368, 280, 372, 240, 340, 180, 350, 80], [300, 362, 330, 420, 300, 480], [270, 300, 250, 240, 210, 150], [360, 380, 420, 470, 480, 520]];
      // Splitter
      const shards = [];
      const glassM = KIT.mat.glass(0xe8f4ff, 0.55);
      for (let i = 0; i < 34; i++) {
        const s = 0.012 + rnd() * 0.03;
        const sh = new T.Shape(); sh.moveTo(0, 0); sh.lineTo(s, rnd() * s * 0.6); sh.lineTo(rnd() * s * 0.6, s); sh.lineTo(0, 0);
        const m = new T.Mesh(new T.ShapeGeometry(sh), glassM); m.visible = false; scene.add(m);
        shards.push({ m, x: (rnd() - 0.5) * 0.26, y: (rnd() - 0.5) * 0.38, vz: -(0.6 + rnd() * 1.4), vx: (rnd() - 0.5) * 0.3, vy: (rnd() - 0.5) * 0.3, r: rnd() * 6, rs: (rnd() - 0.5) * 18 });
      }
      // Luftströme (dünne leuchtende Stäbe, die zum Loch rasen)
      const NS = 90;
      const streakM = new T.MeshBasicMaterial({ color: 0xdff0ff, transparent: true, opacity: 0.75, toneMapped: false, depthWrite: false });
      const streaks = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), streakM, NS); scene.add(streaks);
      const sd = []; for (let i = 0; i < NS; i++) sd.push({ a: rnd() * 6.283, rad: 0.25 + rnd() * 0.9, z: 0.2 + rnd() * 1.4, off: rnd(), sp: 0.8 + rnd() * 0.9, th: 0.002 + rnd() * 0.004 });
      const mtx = new T.Matrix4(), q = new T.Quaternion(), pos = new T.Vector3(), scl = new T.Vector3(), dir = new T.Vector3(), up = new T.Vector3(0, 0, 1), target = new T.Vector3(0, 0, -0.25);
      const st = { crack: 0, broken: 0, storm: 0, frost: 0, sh: 0 };
      const wall0 = cab.wallMat.color.clone(), bez0 = cab.bezelMat.color.clone(), ice = new T.Color(0xbfe3ff);
      const clk = { t: 0 };
      const update = () => {
        const t = clk.t;
        cab.clouds.position.x = 1.2 - (t + 20) * 0.35;
        cab.drawCrack(crackPaths, st.crack);
        const gone = st.broken > 0.5;
        cab.paneIn.visible = !gone; cab.paneOut.visible = !gone; cab.crack.visible = !gone;
        const kk = Math.max(0, t - 1.35);
        shards.forEach((s) => {
          s.m.visible = gone && kk < 1.6;
          s.m.position.set(s.x + s.vx * kk, s.y + s.vy * kk, -0.02 + s.vz * kk);
          s.m.rotation.set(s.r + s.rs * kk * 0.3, s.r * 0.7 + s.rs * kk * 0.2, s.r + s.rs * kk);
        });
        sd.forEach((d, i) => {
          const u = (t * d.sp * 1.1 + d.off) % 1;
          const f = 1 - u; // 1 = weit weg, 0 = am Loch
          pos.set(Math.cos(d.a) * d.rad * f + target.x, Math.sin(d.a) * d.rad * f + target.y, target.z + (d.z + 0.25) * f);
          dir.subVectors(target, pos).normalize();
          q.setFromUnitVectors(up, dir);
          const len = (0.06 + 0.12 * f) * st.storm * Math.sin(u * Math.PI);
          scl.set(d.th, d.th, Math.max(0.0001, len));
          mtx.compose(pos, q, scl); streaks.setMatrixAt(i, mtx);
        });
        streaks.instanceMatrix.needsUpdate = true;
        cab.wallMat.color.copy(wall0).lerp(ice, st.frost * 0.35); cab.bezelMat.color.copy(bez0).lerp(ice, st.frost * 0.55);
        const sh = st.sh;
        camera.position.set(0.18 - t * 0.01 + Math.sin(t * 71) * sh, 0.03 + Math.cos(t * 59) * sh, 2.3 - t * 0.05);
        camera.lookAt(0, 0, -0.05);
        k.render();
      };
      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => { clk.t = tl.time(); update(); }); tl.set({}, {}, 7.4);
      tl.fromTo("#s5-cv", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0);
      tl.fromTo(st, { crack: 0 }, { crack: 1, duration: 0.5, ease: "power4.out" }, 0.15);
      tl.fromTo(st, { sh: 0 }, { sh: 0.012, duration: 0.04 }, 0.15);
      tl.to(st, { sh: 0, duration: 0.4 }, 0.2);
      // Scheibe bricht heraus
      tl.fromTo(st, { broken: 0 }, { broken: 1, duration: 0.01 }, 1.35);
      tl.fromTo(st, { storm: 0 }, { storm: 1, duration: 0.3 }, 1.38);
      tl.to(st, { sh: 0.014, duration: 0.05 }, 1.38);
      tl.to(st, { sh: 0.002, duration: 1.6, ease: "power2.out" }, 1.45);
      tl.to(st, { storm: 0.45, duration: 1.5, ease: "power1.inOut" }, 5.2);
      tl.fromTo("#s5-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.5);
      tl.fromTo("#s5-fog", { opacity: 0 }, { opacity: 0.5, duration: 1.4, ease: "power2.out" }, 3.6);
      tl.to("#s5-fog", { opacity: 0.28, duration: 1.2, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#s5-temp", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 5.0);
      const tmp = { v: 22 };
      tl.fromTo(tmp, { v: 22 }, { v: -56, duration: 1.7, ease: "expo.out", onUpdate: () => { const v = Math.round(tmp.v); document.getElementById("s5-val").textContent = v < 0 ? "−" + Math.abs(v) : v; } }, 5.05);
      tl.fromTo("#s5-num", { color: "#ffffff" }, { color: "#9fd8ff", duration: 1.2 }, 5.2);
      tl.fromTo(st, { frost: 0 }, { frost: 1, duration: 1.4 }, 5.2);
      tl.to(["#s5-cv", "#s5-fog", "#s5-temp", "#s5-foot"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 7.18);
      update();
      window.__timelines["s5"] = tl;
    })();
  </script>
  <script>
    /* WARP START */
    (function () {
      const tl = window.__timelines["s5"].__src || window.__timelines["s5"];
      const w = [[0.0, 0.0], [1.4, 1.445], [2.4, 2.11], [3.6, 3.518], [5.0, 4.607], [6.0, 5.639], [7.4, 7.523], [7.4, 7.523]];
      const o = gsap.timeline({ paused: true }); o.__src = tl;
      for (let i = 0; i < w.length - 1; i++) o.fromTo(tl, { time: w[i][0] }, { time: w[i + 1][0], duration: Math.max(0.001, w[i + 1][1] - w[i][1]), ease: "none", immediateRender: false }, w[i][1]);
      window.__timelines["s5"] = o;
    })();
    /* WARP END */
  </script>
</template>
