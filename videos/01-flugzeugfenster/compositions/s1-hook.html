<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s1-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% 50%, rgba(13,12,15,0) 30%, rgba(13,12,15,0.55) 62%, rgba(13,12,15,0.92) 88%); }
    .pin { position: absolute; left: 0; top: 0; pointer-events: none; }
    .pin i { position: absolute; left: 0; top: 0; width: 2px; background: #e8e7ea; }
    .pin b { position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; }
    .pin span { position: absolute; white-space: nowrap; font: 600 28px "Inter", sans-serif; letter-spacing: 0.14em; color: #ecebef; text-transform: uppercase; }
    #s1-alt { position: absolute; left: 70px; top: 470px; }
    #s1-alt-num { font: 800 96px "Inter", sans-serif; color: #fff; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    #s1-alt-num small { font-size: 44px; font-weight: 700; margin-left: 10px; }
    #s1-alt-sub { font: 500 28px "Inter", sans-serif; color: #b9b8be; margin-top: 10px; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <canvas id="s1-cv" width="1080" height="1920"></canvas>
    <div class="vig" id="s1-vig"></div>
    <div class="pin" id="s1-pin" style="opacity: 0;"><b></b><i style="height: 120px;"></i><span style="left: -110px; top: 132px;">Fenster</span></div>
    <div id="s1-alt" style="opacity: 0;">
      <div id="s1-alt-num"><span id="s1-alt-val">10.600</span><small>m</small></div>
      <div id="s1-alt-sub">Reiseflughöhe</div>
    </div>
  </div>
  <script>
    (function () {
      const T = THREE;
      const k = KIT.stage(document.getElementById("s1-cv"), { fov: 28, exposure: 0.95, envIntensity: 0.5 });
      const { scene, camera } = k;
      const cab = KIT.cabin(k);
      const clouds = cab.clouds;
      const crackPts = [[330, 330, 368, 280, 392, 292, 430, 228, 452, 160], [330, 330, 300, 362, 268, 380, 246, 430], [368, 280, 372, 240]];
      const drawCrack = (p) => cab.drawCrack(crackPts, p);
      // Label
      k.pin(document.getElementById("s1-pin"), new T.Vector3(-0.17, -0.2, 0.05));
      // Kamera-Pfad
      const cam = { x: 0.7, y: 0.12, z: 3.4, lx: 0, ly: 0, sh: 0 };
      const clk = { t: 0 };
      const update = () => {
        clouds.position.x = 1.2 - clk.t * 0.35;
        camera.position.set(cam.x + Math.sin(clk.t * 61) * cam.sh, cam.y + Math.cos(clk.t * 47) * cam.sh, cam.z);
        camera.lookAt(cam.lx, cam.ly, -0.05);
        drawCrack(crk.p);
        k.render();
      };
      const crk = { p: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => { clk.t = tl.time(); update(); }); tl.set({}, {}, 6.6);
      tl.fromTo(cam, { x: 0.7, y: 0.12, z: 3.4 }, { x: 0.32, y: 0.04, z: 2.6, duration: 5.9, ease: "power1.inOut" }, 0);
      // Höhe
      tl.fromTo("#s1-alt", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 1.6);
      const alt = { v: 10600 };
      tl.fromTo(alt, { v: 10600 }, { v: 11000, duration: 1.2, ease: "expo.out", onUpdate: () => { document.getElementById("s1-alt-val").textContent = (Math.round(alt.v / 10) * 10).toLocaleString("de-DE"); } }, 1.65);
      tl.fromTo("#s1-pin", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 3.05);
      // Haarriss bei "bricht?"
      tl.fromTo(crk, { p: 0 }, { p: 1, duration: 0.4, ease: "power4.out" }, 4.3);
      tl.fromTo(cam, { sh: 0 }, { sh: 0.006, duration: 0.05 }, 4.3);
      tl.to(cam, { sh: 0, duration: 0.35, ease: "power2.out" }, 4.35);
      tl.to(["#s1-alt", "#s1-pin"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 5.9);
      // Flug durch das Fenster
      tl.to(cam, { x: 0.0, y: 0.0, z: -0.2, lx: 0, ly: -0.05, duration: 0.65, ease: "power3.in" }, 5.95);
      tl.to("#s1-cv", { filter: "blur(6px)", opacity: 0, duration: 0.2, ease: "power2.in" }, 6.4);
      document.getElementById("s1-vig").style.background = KIT.VIG;
      update();
      window.__timelines["s1"] = tl;
    })();
  </script>
  <script>
    /* WARP START */
    (function () {
      const tl = window.__timelines["s1"].__src || window.__timelines["s1"];
      const w = [[0.0, 0.0], [0.15, 0.119], [1.6, 1.403], [3.0, 2.539], [4.0, 3.089], [5.5, 4.214], [6.6, 5.728]];
      const o = gsap.timeline({ paused: true }); o.__src = tl;
      for (let i = 0; i < w.length - 1; i++) o.fromTo(tl, { time: w[i][0] }, { time: w[i + 1][0], duration: Math.max(0.001, w[i + 1][1] - w[i][1]), ease: "none", immediateRender: false }, w[i][1]);
      window.__timelines["s1"] = o;
    })();
    /* WARP END */
  </script>
</template>
