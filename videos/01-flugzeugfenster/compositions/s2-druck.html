        for (const p of outside) { p.c.setAttribute("cx", (p.x + Math.sin(t * p.w + p.ph) * p.a * 1.6).toFixed(1)); p.c.setAttribute("cy", (p.y + Math.cos(t * p.w * 0.8 + p.ph2) * p.a * 1.6).toFixed(1)); }
        flow.forEach((p, i) => { const u = ((t * 0.55 + i / flow.length) % 1); p.c.setAttribute("cx", (330 + u * 200).toFixed(1)); p.c.setAttribute("cy", (1110 - u * 260 + Math.sin(u * 9 + i) * 10).toFixed(1)); p.c.setAttribute("opacity", (Math.sin(u * Math.PI) * 0.9).toFixed(2)); });
