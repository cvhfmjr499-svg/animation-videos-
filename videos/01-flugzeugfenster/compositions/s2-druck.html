<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s2-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s2-vig { position: absolute; inset: 0; }
    .pin { position: absolute; left: 0; top: 0; pointer-events: none; }
    .pin i { position: absolute; left: 0; top: 0; width: 2px; background: #e8e7ea; }
    .pin b { position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; }
    .pin span { position: absolute; white-space: nowrap; font: 600 28px "Inter", sans-serif; letter-spacing: 0.14em; color: #ecebef; text-transform: uppercase; }
    .read { position: absolute; left: 0; top: 0; pointer-events: none; }
    .read div { position: absolute; white-space: nowrap; font: 800 84px "Inter", sans-serif; color: #fff; letter-spacing: -0.03em; line-height: 1; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
    .read small { font-size: 40px; font-weight: 700; margin-left: 8px; }
    .read em { display: block; font: 600 28px "Inter", sans-serif; font-style: normal; letter-spacing: 0.14em; color: #c9c8ce; margin-bottom: 10px; text-transform: uppercase; }
    #s2-foot { position: absolute; right: 70px; top: 1300px; font: 400 28px "Inter", sans-serif; color: #8a898f; }
  </style>
  <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
    <canvas id="s2-cv" width="1080" height="1920"></canvas>
    <div id="s2-vig"></div>
    <div class="pin" id="s2-pin-out" style="opacity: 0;"><b></b><i style="height: 70px; top: -70px;"></i><span style="left: -60px; top: -112px;">Dünne Luft</span></div>
    <div class="pin" id="s2-pin-duct" style="opacity: 0;"><b></b><i style="height: 80px;"></i><span style="left: -40px; top: 92px;">Triebwerksluft</span></div>
    <div class="read" id="s2-read-in" style="opacity: 0;"><div style="left: -150px; top: -60px; width: 300px; text-align: center;"><em>Kabine</em>0,75<small>bar</small></div></div>
    <div class="read" id="s2-read-out" style="opacity: 0;"><div style="left: -260px; top: 0;"><em>Außen</em>0,23<small>bar</small></div></div>
    <div id="s2-foot" style="opacity: 0;">Querschnitt, vereinfacht</div>
  </div>
  <script>
    (function () {
      const T = THREE;
      document.getElementById("s2-vig").style.background = KIT.VIG;
      const k = KIT.stage(document.getElementById("s2-cv"), { fov: 30, exposure: 1.0, envIntensity: 0.7 });
      const { scene, camera } = k;
      const rnd = KIT.rng(1337);
      const L = 2.4;
      // Rumpfröhre mit Schnittfläche
      const ring = KIT.roundRect(0.001, 0.001, 0); // Platzhalter
      const shp = new T.Shape(); shp.absarc(0, 0, 1.0, 0, Math.PI * 2, false);
      const hole = new T.Path(); hole.absarc(0, 0, 0.93, 0, Math.PI * 2, true); shp.holes.push(hole);
      const tubeG = new T.ExtrudeGeometry(shp, { depth: L, bevelEnabled: false, curveSegments: 96 });
      tubeG.translate(0, 0, -L);
      const tube = new T.Mesh(tubeG, [KIT.mat.plastic(0x9a958d, 0.7), KIT.mat.plastic(0xe9e7e3, 0.35)]);
      tube.castShadow = true; tube.receiveShadow = true; scene.add(tube);
      // Innenverkleidung (dunkler, damit Teilchen leuchten)
      const lining = new T.Mesh(new T.CylinderGeometry(0.925, 0.925, L, 96, 1, true), new T.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.8, side: T.BackSide }));
      lining.rotation.x = Math.PI / 2; lining.position.z = -L / 2; scene.add(lining);
      // Boden + Frachtraum
      const floor = new T.Mesh(new T.BoxGeometry(1.78, 0.04, L), KIT.mat.plastic(0x4b505b, 0.6)); floor.position.set(0, -0.36, -L / 2); floor.receiveShadow = true; scene.add(floor);
      const cargo = new T.Mesh(new T.BoxGeometry(1.2, 0.36, L * 0.98), KIT.mat.plastic(0x1d2028, 0.8)); cargo.position.set(0, -0.6, -L / 2); scene.add(cargo);
      // Gepäckfächer
      for (const sgn of [-1, 1]) {
        const bin = new T.Mesh(KIT.roundBox(0.42, 0.2, L * 0.98, 0.04), KIT.mat.plastic(0xd9d6cf, 0.45));
        bin.position.set(sgn * 0.6, 0.5, -L / 2); bin.rotation.z = sgn * 0.45; bin.castShadow = true; scene.add(bin);
      }
      // Sitzreihen
      const seatMat = KIT.mat.fabric(0x2b3a5c), coverMat = KIT.mat.fabric(0xe9e6df);
      const seatG = KIT.roundBox(0.17, 0.36, 0.06, 0.03), cushG = KIT.roundBox(0.17, 0.05, 0.17, 0.02), headG = KIT.roundBox(0.15, 0.08, 0.012, 0.005);
      for (const z of [-0.25, -0.85, -1.45, -2.05]) for (const x of [-0.66, -0.48, -0.30, 0.30, 0.48, 0.66]) {
        const b = new T.Mesh(seatG, seatMat); b.position.set(x, -0.14, z); b.rotation.x = -0.12; b.castShadow = true; scene.add(b);
        const c = new T.Mesh(cushG, seatMat); c.position.set(x, -0.28, z + 0.1); scene.add(c);
        const h = new T.Mesh(headG, coverMat); h.position.set(x, -0.0, z + 0.035); h.rotation.x = -0.12; scene.add(h);
      }
      // Luftteilchen
      const dotG = new T.SphereGeometry(0.014, 10, 8);
      const mkDots = (n, place, col) => {
        const m = new T.InstancedMesh(dotG, new T.MeshBasicMaterial({ color: col, toneMapped: false }), n);
        const d = []; for (let i = 0; i < n; i++) d.push({ p: place(), ph: rnd() * 6.28, w: 0.8 + rnd() * 1.4 });
        scene.add(m); return { m, d };
      };
      const inside = mkDots(520, () => { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * 0.86; return new T.Vector3(Math.cos(a) * r, Math.sin(a) * r * 0.95 + 0.04, -rnd() * L + 0.05); }, 0x9fd2ff);
      const outside = mkDots(70, () => { let x, y; do { x = (rnd() - 0.5) * 4.2; y = (rnd() - 0.5) * 4.6; } while (Math.hypot(x, y) < 1.2); return new T.Vector3(x, y, -rnd() * 3 + 0.6); }, 0x6fa8de);
      // Triebwerk + Zuleitung
      const eng = new T.Group();
      const nac = new T.Mesh(new T.CylinderGeometry(0.26, 0.22, 0.9, 48, 1, true), KIT.mat.plastic(0xd5d8de, 0.3)); nac.rotation.x = Math.PI / 2; eng.add(nac);
      const inlet = new T.Mesh(new T.TorusGeometry(0.255, 0.03, 16, 48), KIT.mat.metal(0xb8bcc4, 0.3)); inlet.position.z = 0.45; eng.add(inlet);
      const fan = new T.Mesh(new T.CircleGeometry(0.24, 48), KIT.mat.metal(0x3a3d44, 0.4)); fan.position.z = 0.36; eng.add(fan);
      eng.position.set(-1.75, -1.15, -0.8); eng.visible = true; scene.add(eng);
      const curve = new T.CatmullRomCurve3([new T.Vector3(-1.6, -0.95, -0.8), new T.Vector3(-1.2, -0.85, -0.6), new T.Vector3(-0.75, -0.75, -0.5), new T.Vector3(-0.35, -0.5, -0.45)]);
      const duct = new T.Mesh(new T.TubeGeometry(curve, 40, 0.045, 16), KIT.mat.metal(0xc9ccd2, 0.35)); scene.add(duct);
      const ductGrp = [eng, duct];
      const flow = mkDots(16, () => new T.Vector3(), 0xd6efff);
      // Licht
      scene.add(new T.HemisphereLight(0xa8c0ff, 0x101014, 0.25));
      KIT.keyLight(scene, new T.Vector3(2.5, 3.2, 4.5), new T.Vector3(0, 0, -0.6), 120).angle = 0.45;
      const rim = new T.DirectionalLight(0x9cc0ff, 1.2); rim.position.set(-3, 2, -4); scene.add(rim);
      const fill = new T.PointLight(0xfff0dc, 2.5, 0, 2); fill.position.set(0, 0.3, -0.6); scene.add(fill);
      // Pins
      k.pin(document.getElementById("s2-pin-out"), new T.Vector3(-0.85, 1.2, -0.2));
      k.pin(document.getElementById("s2-pin-duct"), new T.Vector3(-1.75, -1.42, -0.8));
      k.pin(document.getElementById("s2-read-in"), new T.Vector3(0, 0.28, 0.1));
      k.pin(document.getElementById("s2-read-out"), new T.Vector3(1.05, -1.0, 0));
      const mtx = new T.Matrix4();
      const cam = { r: 11, az: 0.42, el: 0.2, ductIn: 0, flowOn: 0 };
      const clk = { t: 0 };
      const update = () => {
        const t = clk.t;
        inside.d.forEach((q, i) => { mtx.makeTranslation(q.p.x + Math.sin(t * q.w * 2.2 + q.ph) * 0.03, q.p.y + Math.cos(t * q.w * 1.9 + q.ph) * 0.03, q.p.z + Math.sin(t * q.w + q.ph) * 0.03); inside.m.setMatrixAt(i, mtx); });
        outside.d.forEach((q, i) => { mtx.makeTranslation(q.p.x + Math.sin(t * q.w + q.ph) * 0.08, q.p.y + Math.cos(t * q.w * 0.8 + q.ph) * 0.08, q.p.z); outside.m.setMatrixAt(i, mtx); });
        flow.d.forEach((q, i) => { const u = (t * 0.6 + i / flow.d.length) % 1; const p = curve.getPointAt(u); const s = cam.flowOn * Math.sin(u * Math.PI); mtx.makeScale(s, s, s).setPosition(p); flow.m.setMatrixAt(i, mtx); });
        inside.m.instanceMatrix.needsUpdate = true; outside.m.instanceMatrix.needsUpdate = true; flow.m.instanceMatrix.needsUpdate = true;
        for (const o of ductGrp) { o.position.x = (o === eng ? -1.75 : 0) - (1 - cam.ductIn) * 1.2; }
        const az = cam.az + t * 0.02;
        camera.position.set(Math.sin(az) * cam.r, 0.25 + cam.el * cam.r * 0.3, Math.cos(az) * cam.r - 0.8);
        camera.lookAt(-0.2, -0.05, -0.8);
        k.render();
      };
      const tl = gsap.timeline({ paused: true });
      tl.eventCallback("onUpdate", () => { clk.t = tl.time(); update(); }); tl.set({}, {}, 10.8);
      // Eintritt: Kamera zieht aus dem Fenster zurück
      tl.fromTo(cam, { r: 3.0 }, { r: 11, duration: 1.2, ease: "expo.out" }, 0);
      tl.fromTo("#s2-cv", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#s2-foot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
      tl.fromTo("#s2-pin-out", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.45);
      // Triebwerksluft
      tl.fromTo(cam, { ductIn: 0 }, { ductIn: 1, duration: 0.7, ease: "expo.out" }, 4.9);
      tl.fromTo(cam, { flowOn: 0 }, { flowOn: 1, duration: 0.4 }, 5.2);
      tl.fromTo("#s2-pin-duct", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 5.35);
      tl.to("#s2-pin-out", { opacity: 0, duration: 0.2 }, 7.6);
      tl.fromTo("#s2-read-in", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 7.85);
      tl.to("#s2-pin-duct", { opacity: 0, duration: 0.2 }, 8.9);
      tl.fromTo("#s2-read-out", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 9.25);
      tl.to(["#s2-cv", "#s2-read-in", "#s2-read-out", "#s2-foot"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 10.55);
      update();
      window.__timelines["s2"] = tl;
    })();
  </script>
  <script>
    /* WARP START */
    (function () {
      const tl = window.__timelines["s2"].__src || window.__timelines["s2"];
      const w = [[0.0, 0.0], [1.4, 0.929], [2.4, 1.559], [3.6, 2.465], [4.9, 3.647], [6.3, 4.954], [7.7, 6.685], [9.1, 10.136], [10.8, 13.714], [10.8, 13.714]];
      const o = gsap.timeline({ paused: true }); o.__src = tl;
      for (let i = 0; i < w.length - 1; i++) o.fromTo(tl, { time: w[i][0] }, { time: w[i + 1][0], duration: Math.max(0.001, w[i + 1][1] - w[i][1]), ease: "none", immediateRender: false }, w[i][1]);
      window.__timelines["s2"] = o;
    })();
    /* WARP END */
  </script>
</template>
